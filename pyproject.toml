[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testagent2"
version = "0.1.0"
description = "Hermes-style CLI AI Agent MVP with Traditional Chinese source code"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "google-cloud-bigquery>=3.0.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "jsonschema>=4.26.0",
  "cryptography>=46.0.0",
  "httpx>=0.28.0",
]

[project.scripts]
testagent2 = "繁中代理.cli:執行主程式"

[tool.setuptools.packages.find]
include = ["繁中代理*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
