apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: testagent2-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: REPLACE_FRONTEND_SERVICE_ACCOUNT
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: asia-east1-docker.pkg.dev/lab-cola-rd/testagent2/testagent2-web:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BACKEND_ORIGIN
              value: https://REPLACE_BACKEND_HOSTNAME
